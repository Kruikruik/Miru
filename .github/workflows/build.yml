name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Préparer la clé de signature (depuis les Secrets GitHub)
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE" ] || [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::Secrets SIGNING_KEYSTORE / SIGNING_PASSWORD manquants (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE" | base64 -d > app/miru.keystore

      - name: Compiler l'APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Garder l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: miru-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publier dans « Releases » (lien direct pour le téléphone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Miru.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Miru.apk \
            --title "Miru (dernière version)" \
            --notes "Compilé automatiquement depuis le commit ${GITHUB_SHA::7}.

          versionCode: ${GITHUB_RUN_NUMBER}
          versionName: 1.0.${GITHUB_RUN_NUMBER}"
